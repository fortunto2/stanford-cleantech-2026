# California, outdoor workplaces. One file per jurisdiction; the engine knows no law.
# Metrics the forecast provides: us_aqi_pm25 (NowCast), pm25_nowcast_ugm3, pm25_ugm3, temp_f, temp_c.
# Smoke rules use the NowCast concentration, as §5141.1 Appendix A does: AQI 151 = 55.5 µg/m³,
# AQI over 500 = 500.5 µg/m³. An AQI threshold of 501 can never trip: the scale stops at 500.
# Within a group the most severe rule crossed during the shift wins; its first hour is reported.
jurisdiction: US-CA
name: California (Cal/OSHA)
rules:
  - id: smoke-respirators
    group: smoke
    metric: pm25_nowcast_ugm3
    gte: 500.5
    action: "PM2.5 {value:.1f} µg/m³ (AQI over 500): respirators mandatory, move work to filtered indoor air if possible"
    cite: Cal/OSHA T8 §5141.1, App. A
  - id: smoke-n95
    group: smoke
    metric: pm25_nowcast_ugm3
    gte: 55.5
    action: "AQI {aqi}: hand out N95s, tell the crew, cut exposure"
    cite: Cal/OSHA T8 §5141.1, App. A
  - id: heat-high
    group: heat
    metric: temp_f
    gte: 95
    action: "{value:.0f}°F: high-heat procedures, pre-shift meeting, watch the crew"
    cite: Cal/OSHA T8 §3395
  - id: heat-shade
    group: heat
    metric: temp_f
    gte: 80
    action: "{value:.0f}°F: shade up, water at hand"
    cite: Cal/OSHA T8 §3395
